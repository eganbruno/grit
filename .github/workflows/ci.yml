name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The suite drives the real git binary. Pin an identity so commits in the
      # throwaway repos succeed on a runner with no global config.
      - name: Configure git
        run: |
          git config --global user.name "grit ci"
          git config --global user.email "ci@grit.invalid"
          git config --global init.defaultBranch main
      # The dolt backend's integration tests drive the real binary and skip
      # themselves when it is absent, so CI has to supply it or they are
      # silently vacuous. `dolt version` fails the step if the install did not
      # take.
      - name: Install dolt
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install dolt
          else
            sudo bash -c 'curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | bash'
          fi
          dolt version
      # `tests/cli_shell.rs` checks each emitted init script against its own
      # shell's parser and skips when that shell is missing. Supply all three,
      # or the checks pass by not running.
      - name: Install the shells the init scripts target
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install fish
          else
            sudo apt-get update && sudo apt-get install -y zsh fish
          fi
          zsh --version && bash --version | head -1 && fish --version
      - run: cargo test --all-features

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features
