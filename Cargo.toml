[package]
name = "grit"
version = "0.1.0"
edition = "2024"
# 1.85 is the edition-2024 floor, but `etcetera` requires 1.87. The `msrv` CI
# job is what proves this number; do not raise it by hand without checking
# `cargo metadata` for the real constraint.
rust-version = "1.87"
description = "Work across many git repositories from anywhere, by alias."
authors = ["Bruno Egan <bruno.egan@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/eganbruno/grit"
homepage = "https://github.com/eganbruno/grit"
readme = "README.md"
keywords = ["git", "cli", "monorepo", "multi-repo", "productivity"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "docs/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
etcetera = "0.11.0"
# default-features = false skips the bundled tz database; we only need
# `Timestamp::now()` and RFC 3339 formatting, which are UTC-only.
jiff = { version = "0.2.35", default-features = false, features = [
    "std",
    "serde",
] }
owo-colors = "4.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
terminal_size = "0.4.4"
thiserror = "2.0.19"
toml = "1.1.4"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# Integration tests do not inherit the library's dependencies, so `--json`
# assertions need their own copy.
serde_json = "1.0.151"

[profile.release]
lto = "thin"
strip = true
