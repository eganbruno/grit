[package]
name = "grit"
version = "0.3.0"
edition = "2024"
# 1.85 is the edition-2024 floor, but `etcetera` requires 1.87. The `msrv` CI
# job is what proves this number; do not raise it by hand without checking
# `cargo metadata` for the real constraint.
rust-version = "1.87"
description = "Work across many git and dolt repositories from anywhere, by alias."
authors = ["Bruno Egan <bruno.egan@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/eganbruno/grit"
homepage = "https://github.com/eganbruno/grit"
readme = "README.md"
keywords = ["git", "cli", "monorepo", "multi-repo", "productivity"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
etcetera = "0.11.0"
# default-features = false skips the bundled tz database; we only need
# `Timestamp::now()` and RFC 3339 formatting, which are UTC-only.
jiff = { version = "0.2.35", default-features = false, features = [
    "std",
    "serde",
] }
owo-colors = "4.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
terminal_size = "0.4.4"
thiserror = "2.0.19"
toml = "1.1.4"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# A GitHub repo to push Homebrew formulas to
tap = "eganbruno/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
